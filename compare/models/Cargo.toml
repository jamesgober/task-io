# loom models of the prototype protocols in compare/src/proto.rs (RESEARCH
# section 6). Its own workspace, never published, never a dependency of
# task-io; task-io's own models live in its tests under cfg(loom).
[package]
name         = "task-io-models"
version      = "0.0.0"
edition      = "2024"
# The harness only (task-io itself stays at 1.85); matches compare/.
rust-version = "1.88"
publish      = false
license      = "Apache-2.0 OR MIT"

[workspace]

[dependencies]
loom = "=0.7.2"

[profile.test]
opt-level = 3
