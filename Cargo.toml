# =============================================================================
#  R E P S   ·   task-io
# =============================================================================
[package]
name    = "task-io"
version = "0.1.0"

# Minimum Supported Rust Version (MSRV)
rust-version = "1.85"
edition = "2024"

# License
license = "Apache-2.0 OR MIT"

# Readme
readme = "README.md"

# Description
description = "Task dispatch pipeline for Rust: workers, priority lanes, delays, cron, retries, dead letters, idempotency keys, leases, and durable stores, then dispatch across nodes. Dependency-free."

# Keywords (5 max)
keywords = ["jobs", "queue", "scheduler", "workers", "task"]

# Categories
categories = ["concurrency"]

# Links
homepage      = "https://github.com/jamesgober/task-io"
repository    = "https://github.com/jamesgober/task-io"
documentation = "https://docs.rs/task-io"

# Authors
authors = ["James Gober <me@jamesgober.com>"]

# Keep development-only paths out of the published package.
exclude = [
    "/.dev",
    "/.claude",
    "/.github",
    "/dev",
    "/docs",
    "/benches",
    "/tests",
    "/compare",
    "/fuzz",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "task_io"
path = "src/lib.rs"


# FEATURE FLAGS
# #################################
[features]
default = []


# DEPENDENCIES
# #################################
[dependencies]
# None. The workers, queues, timer wheel, and the OS calls they need
# (thread parking, CPU topology, affinity) are all in this crate.


# DEV DEPENDENCIES
# #################################
[dev-dependencies]


# RELEASE PROFILE
# #################################
[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = "symbols"

# Benchmarks measure the code users ship, so they use the release settings.
# Cargo always builds benches with unwinding, which criterion and the
# panic-isolation benches need.
[profile.bench]
inherits      = "release"
strip         = "none"
debug         = "line-tables-only"
