name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # Run every JS action on Node.js 24 ahead of GitHub's forced migration,
  # silencing "Node.js 20 actions are deprecated" runner warnings.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: Test (${{ matrix.os }} / ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, "1.85"]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (default features)
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy (all features)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Clippy (no default features)
        run: cargo clippy --all-targets --no-default-features -- -D warnings
      - name: Test (default features)
        run: cargo test
      - name: Test (all features)
        run: cargo test --all-features
      - name: Test (no default features)
        run: cargo test --no-default-features
      - name: Build examples
        run: cargo build --examples
      - name: Doc (all features)
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"

  security:
    name: Security (audit + deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit and cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - name: Generate lockfile
        run: cargo generate-lockfile
      - name: Audit
        run: cargo audit
      - name: Deny
        run: cargo deny check
      # task-io has zero runtime dependencies in every feature combination
      # (dev/PLAN.md D-017). The normal dependency tree must be task-io alone.
      - name: Zero dependencies
        shell: bash
        run: |
          for flags in "" "--all-features" "--no-default-features"; do
            tree=$(cargo tree -e normal --prefix none $flags)
            # grep exits 1 when it selects nothing (the passing case), so it
            # must not run as a pipeline stage under `-o pipefail`.
            deps=$(printf '%s\n' "$tree" | awk '!/^task-io v/' | sort -u)
            if [ -n "$deps" ]; then
              echo "runtime dependencies found ($flags):"
              echo "$deps"
              exit 1
            fi
          done

  compare:
    name: Compare harness builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            compare
            compare/fang
      # The harness is a separate workspace with pinned competitor versions; it
      # is only compiled and linted here, never run (gating runs happen on the
      # reference hosts, dev/BENCHMARKS.md section 2).
      - name: Clippy (compare)
        working-directory: compare
        run: cargo clippy --release --locked -- -D warnings
      - name: Clippy (compare, ws-no-park build)
        working-directory: compare
        run: cargo clippy --release --locked --features ws-no-park -- -D warnings
      - name: Clippy (compare/fang)
        working-directory: compare/fang
        run: cargo clippy --release --locked -- -D warnings
